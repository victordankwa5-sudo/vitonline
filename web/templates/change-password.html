{% extends 'base.html' %} {% block title %} Password Recovery {% endblock %}
{% block body %}
<!-- Background decorations -->
<div class="circle one"></div>
<div class="circle two"></div>
<!-- LOGIN CARD -->
<div class="login-card">
  <!-- Logo -->
  <div class="logo">
    <i class="fa-solid fa-lock"></i>
  </div>
  <!-- Heading -->
  <h1>Password recovery</h1>
  <p class="subtitle">Enter a new password to change your existing password</p>
  <!-- LOGIN FORM -->
  <form id="loginForm" , method="POST">
    <!-- EMAIL -->
    <div class="form-group">
      <label for="new-password"> NEW PASSWORD </label>
      <div class="input-wrapper">
        <i class="fa-solid fa-envelope"></i>
        <input
          type="password"
          id="new-password-el"
          name="new-password"
          placeholder="Enter new password"
          required
        />
      </div>
    </div>
    <!-- OPTIONS -->
    <div class="options">
      <a href="#" class="forgot"> Other method </a>
    </div>
    <!-- LOGIN BUTTON -->
    <button type="submit" class="login-btn" id="loginBtn">CREATE PASSWORD</button>
  </form>
  <!-- DIVIDER -->
  <div class="divider">OR</div>
  <!-- REGISTER -->
  <p class="register">
    Don't have an account?
    <a href="signup"> Create account </a>
  </p>
</div>
{% endblock %}
