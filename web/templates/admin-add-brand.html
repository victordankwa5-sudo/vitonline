{% extends 'admin-base.html' %} {% block title %} Add Brand {%
endblock %} {% block body %}
<div class="modal show">
  <div class="modal-box">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">New Brand</h2>
        <p>Enter brand name below.</p>
      </div>
      <button class="close-btn" id="closeBrandModal">×</button>
    </div>
    <form id="productForm" method="POST" enctype="multipart/form-data">
      <div class="form-group">
        <label>Brand Name</label>
        <input
          type="text"
          name="brand-name"
          id="brand-name"
          placeholder="Enter brand name here"
          required
        />
      </div>
      <div class="modal-actions">
        <button type="button" class="cancel-btn" id="cancelBrandModal">
          Cancel
        </button>
        <button type="submit" class="primary-btn">Add brand</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
